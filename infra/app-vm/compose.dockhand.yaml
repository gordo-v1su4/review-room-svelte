name: review-room-svelte-app
services:
  app:
    image: review-room-svelte-app-app:fd01415
    pull_policy: never
    labels:
      dockhand.update: "false"
      dockhand.url: https://review.v1su4.dev
    restart: unless-stopped
    environment:
      REVIEW_ROOM_CONVEX_URL: ${REVIEW_ROOM_CONVEX_URL:?REVIEW_ROOM_CONVEX_URL required}
      PUBLIC_CONVEX_URL: ${PUBLIC_CONVEX_URL:?PUBLIC_CONVEX_URL required}
      PUBLIC_CONVEX_SITE_URL: ${PUBLIC_CONVEX_SITE_URL:?PUBLIC_CONVEX_SITE_URL required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT required}
      S3_REGION: ${S3_REGION:?S3_REGION required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET required}
      REVIEW_ROOM_CONVEX_ADMIN_KEY: ${REVIEW_ROOM_CONVEX_ADMIN_KEY:?REVIEW_ROOM_CONVEX_ADMIN_KEY required}
      REVIEW_ROOM_OWNER_PASSWORD: ${REVIEW_ROOM_OWNER_PASSWORD:?REVIEW_ROOM_OWNER_PASSWORD required}
      REVIEW_ROOM_SESSION_SECRET: ${REVIEW_ROOM_SESSION_SECRET:?REVIEW_ROOM_SESSION_SECRET required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY required}
      REVIEW_ROOM_TRIGGER_SECRET_KEY: ${REVIEW_ROOM_TRIGGER_SECRET_KEY:?REVIEW_ROOM_TRIGGER_SECRET_KEY required}
      ORIGIN: https://review.v1su4.dev
      REVIEW_ROOM_OWNER_EMAIL: gordo@v1su4.com
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:18094:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

