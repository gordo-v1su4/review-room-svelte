name: Deploy Convex

on:
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - "convex.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-convex.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-room-convex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy self-hosted Convex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production target
        shell: bash
        run: |
          if [[ -z "$CONVEX_SELF_HOSTED_URL" || -z "$CONVEX_SELF_HOSTED_ADMIN_KEY" ]]; then
            echo "::error::Convex production deployment secrets are missing."
            exit 1
          fi

          if [[ "$CONVEX_SELF_HOSTED_URL" != "https://unfold.serving.cloud" ]]; then
            echo "::error::Refusing to deploy to a non-Review Room Convex target."
            exit 1
          fi

      - name: Deploy Convex functions
        run: bun run deploy:convex -- --message "GitHub Actions ${GITHUB_SHA}"

      - name: Verify deployed functions respond
        run: bunx convex run auth:oauthProviders '{}' > /dev/null

      - name: Record deployment
        run: echo "Convex production deployed for ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
